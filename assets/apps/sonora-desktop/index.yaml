description: "Native desktop client for Navidrome and Subsonic servers, written in Rust on Zed's GPUI. Gapless playback, an equalizer, synced and karaoke lyrics, scrobbling to Last.fm and ListenBrainz, themes and icon packs, and local files beside your server library."
