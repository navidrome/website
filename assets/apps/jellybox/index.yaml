name: JellyBox
url: https://jellybox.app
repoUrl: https://github.com/avdept/JellyBoxPlayer

platforms:
  android:
    store: https://play.google.com/store/apps/details?id=com.prodigytech.jellybox
  ios:
    store: https://apps.apple.com/us/app/jellybox-player/id6469732117
  macos:
    store: https://apps.apple.com/us/app/jellybox-player/id6469732117?platform=mac
  windows: true
  linux: true

api: OpenSubsonic

description: "A native music player for iPhone, iPad, Mac, Android, Android TV, Windows and Linux. CarPlay and Android Auto, offline downloads, synced lyrics, ratings, daily mixes and Infinite Play, Continuity to move playback between devices, and casting to AirPlay, Chromecast, Sonos groups, WiiM and DLNA, with colour themes, animated album covers and a UI built for each platform."

