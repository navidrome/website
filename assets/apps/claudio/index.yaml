description: "Audio player for your own audiobooks, podcasts and music that takes data protection seriously. Plays from Navidrome and other Subsonic servers, Jellyfin, Audiobookshelf, NAS/SMB, WebDAV, SFTP, DLNA and iCloud Drive, with downloads, scrobbling, CarPlay and a 10-band EQ."

