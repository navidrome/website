api: Navidrome

description: >-
  LynMusic is a music player for iPhone, iPad, Mac, and Apple TV. Bring your music together from local files, SMB, WebDAV, Navidrome, Subsonic, Emby, and Jellyfin. 
  Enjoy synced lyrics, playlists, favorites, a sleep timer, and AirPlay. On iPhone, iPad, and Mac, download music for offline listening and share lyrics as images.

