description: "An audiophile music player for iPhone, iPad, Mac and CarPlay that works with Navidrome, Subsonic, OpenSubsonic and LMS servers. All core features are free forever: streaming, offline downloads, synced lyrics, multiple servers, CarPlay, widgets, Siri and Spotlight. Sound Room Pro adds Jam to listen together in real time on one synced queue, Bit-Perfect DAC playback with EQ and a live signal path, and custom themes, fonts and layouts."
