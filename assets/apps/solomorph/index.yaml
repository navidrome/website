description: "A music client with no brand color: the only color it shows is sampled from the art of whatever album is playing. The free tier covers one server, uncapped, with a real per-device equalizer; a one-time unlock adds offline downloads, several servers browsed as one merged library, and the music already on the phone as its own source."
