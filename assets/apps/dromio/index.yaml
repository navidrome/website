# Navidrome Client App Entry Template
# See: https://www.navidrome.org/docs/developers/adding-apps/

# Required: Display name of the app
name: Dromio

# Required: Official app website or homepage
url: https://github.com/mattneub/dromio

# Optional: GitHub repository URL (displays an open source badge)
# Currently, number of stars is insufficient to say this.
# repoUrl: https://github.com/mattneub/dromio

# Required: At least one platform must be specified
# Platforms can be boolean (true) or object with store URL
platforms:
  # Android with Play Store link
  # android:
  #  store: https://play.google.com/store/apps/details?id=com.example.app
  # iOS with App Store link
  ios:
    store: https://apps.apple.com/us/app/dromio/id6743675444
  # macOS with optional Mac App Store link. It must end with ?platform=mac,
  # or the App Store opens the iPhone version
  # macos:
  #  store: https://apps.apple.com/app/my-app/id123456789?platform=mac
  # Apple TV with App Store link. It must end with ?platform=tv
  # tvos:
  #  store: https://apps.apple.com/app/my-app/id123456789?platform=tv
  # Or just boolean for platforms without store links
  # windows: true
  # linux: true
  # freebsd: true
  # Web app with hosted URL
  # web:
  #  url: https://my-awesome.netlify.app
  # Docker with optional Docker Hub/GHCR link
  # docker:
  #  store: https://hub.docker.com/r/example/my-app
  # CLI tools or other platforms
  # other: true

# Required: API compatibility
# Use "OpenSubsonic" for modern API support, "Subsonic" for legacy API, or "Navidrome" for Navidrome-specific features
api: Navidrome

# Required: Brief description (1-2 sentences, max 500 characters)
# Highlight key features that make this app unique
description: "Dromio adopts a minimalist attitude, supplying very few screens: its goal is to help you survey, select, and play your music — and that’s all. It is oriented particularly towards Classical music collections, fully displaying long track titles and artist information, and supporting tagging for Composer and Year; playback of multiple tracks is gapless. Supports multiple accounts on multiple servers. No user creation, no multiple playlists, no favorites, no play counts, genres, or artwork."

# Required: Screenshots configuration
screenshots:
  # Required: Thumbnail image filename (must exist in app folder). This is the image that will show in the main catalog page, it is NOT a logo or icon.
  thumbnail: thumbnail.webp
  # Optional: Gallery screenshots (max 5 images)
  # gallery:
  #  - screen1.webp
  #  - screen2.webp
  #  - screen3.webp

# Required: Pricing model. One of:
#   free     - no cost at all
#   freemium - free to download, has in-app purchases / subscriptions
#   trial    - purchase required, but a free trial is available
#   paid     - purchase required
pricing: free

# Optional: Additional search terms (max 6, not displayed on app card)
# Use for alternative names, abbreviations, or key features
# keywords:
  # - chromecast
  # - carplay
  # - offline
