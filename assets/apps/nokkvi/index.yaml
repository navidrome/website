name: Nokkvi
url: https://github.com/f-o-o-g-s/nokkvi
repoUrl: https://github.com/f-o-o-g-s/nokkvi
platforms:
  linux: true
api: Navidrome
description: "A native Navidrome player for Linux, built in Rust on its own PipeWire engine for gapless playback, crossfades and opt-in bit-perfect output. Comes with GPU visualizers and MilkDrop presets, lyrics synced by line or by word, a smart playlist editor, a mix builder, and a CLI for scripting the running player."
