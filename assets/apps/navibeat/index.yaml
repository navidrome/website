description: "A native player for Subsonic, OpenSubsonic and Navidrome: iPhone, iPad, Mac, Apple TV, Apple Watch and CarPlay from one Universal Purchase, and Android and Windows, each sold on its own. Time-synced lyrics, offline downloads, internet radio, Last.fm and ListenBrainz. Sessions move between devices over the play queue. Similar artists come from your own server. Its own Navidrome plugin puts personal mixes on Home. No analytics, no accounts, no backend. A paid Mac add-on syncs to Rockbox."
