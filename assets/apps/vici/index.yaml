name: Vici
url: https://github.com/Aut0iq/Vici
repoUrl: https://github.com/Aut0iq/Vici
platforms:
  android:
    store: https://github.com/Aut0iq/Vici/releases/latest
  windows: true
  linux: true
api: OpenSubsonic
description: "A music player for Navidrome and Subsonic servers on Android, Windows and Linux, based on Castafiore. Features a full-screen player with a MilkDrop visualizer, synced lyrics from the server or LRCLIB, on-device Last.fm scrobbling, an endless random mix, a home screen widget, a desktop app with a queue sidebar and media keys, and vici-tui, a keyboard-driven player for the Linux terminal."
