name: Vici
url: https://github.com/Aut0iq/Vici
repoUrl: https://github.com/Aut0iq/Vici
platforms:
  android:
    store: https://github.com/Aut0iq/Vici/releases/latest
  windows: true
api: OpenSubsonic
description: "A music player for Navidrome and Subsonic servers on Android and Windows, based on Castafiore. Features a full-screen player with a MilkDrop visualizer, synced lyrics from the server or LRCLIB, on-device Last.fm scrobbling, a home screen widget, and a desktop app with a queue sidebar, media keys and auto-updates."
