name: Resonus

url: https://github.com/juananzzz/resonus

repoUrl: https://github.com/juananzzz/resonus

platforms:
  android:
    store: https://github.com/juananzzz/resonus/releases/latest
  ios:
    store: https://github.com/juananzzz/resonus/releases/latest

api: OpenSubsonic

description: "A clean music player for Navidrome, OpenSubsonic, Jellyfin and Ampache servers, or for the files on your phone. Synced lyrics with tap-to-seek, offline downloads, gapless, crossfade, an equalizer, ReplayGain, casting to UPnP/DLNA and Sonos, Android Auto and queue sync across devices, in a UI where almost anything can be shown, hidden or reordered."

