name: Preview Deploy

on:
    workflow_run:
        workflows: ["Preview Build"]
        types:
            - completed

permissions:
    actions: read
    contents: read
    pull-requests: write

jobs:
    deploy-preview:
        runs-on: ubuntu-latest
        if: >
            github.event.workflow_run.event == 'pull_request' &&
            github.event.workflow_run.conclusion == 'success'

        steps:
            - name: Download build output
              uses: actions/download-artifact@v8
              with:
                  name: preview-build
                  path: preview/
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  run-id: ${{ github.event.workflow_run.id }}

            # The artifact comes from the PR's own build, so it is untrusted.
            # Check the PR number against the head SHA of the run that built it.
            - name: Get PR number
              id: get-pr
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
              run: |
                  if [ ! -f preview/PR_NUMBER ]; then
                    echo "::error::PR_NUMBER file not found in downloaded artifact."
                    exit 1
                  fi
                  pr_number=$(head -c 20 preview/PR_NUMBER | tr -d '[:space:]')
                  rm preview/PR_NUMBER
                  case "$pr_number" in ''|*[!0-9]*)
                    echo "::error::PR_NUMBER in the artifact is not a number"; exit 1;;
                  esac
                  sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number" --jq .head.sha)
                  if [ "$sha" != "$HEAD_SHA" ]; then
                    echo "::error::artifact claims PR #$pr_number, but its head $sha is not $HEAD_SHA"; exit 1
                  fi
                  # A Pages _worker.js would run PR code on the server side of the preview.
                  rm -rf preview/_worker.js
                  echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

            - name: Deploy to Cloudflare Pages
              uses: cloudflare/wrangler-action@v4
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  command: pages deploy preview/ --project-name=navidrome-website --branch=pr-${{ steps.get-pr.outputs.pr_number }}

            - name: Find existing comment
              uses: peter-evans/find-comment@v4
              id: find-comment
              with:
                  issue-number: ${{ steps.get-pr.outputs.pr_number }}
                  comment-author: "github-actions[bot]"
                  body-includes: "Preview Deployment"

            - name: Create or update comment
              uses: peter-evans/create-or-update-comment@v5
              with:
                  comment-id: ${{ steps.find-comment.outputs.comment-id }}
                  issue-number: ${{ steps.get-pr.outputs.pr_number }}
                  edit-mode: replace
                  body: |
                      ## Preview Deployment

                      | Status | URL |
                      |--------|-----|
                      | :white_check_mark: Deployed | [pr-${{ steps.get-pr.outputs.pr_number }}.navidrome-website.pages.dev](https://pr-${{ steps.get-pr.outputs.pr_number }}.navidrome-website.pages.dev) |

                      *Built from ${{ github.event.workflow_run.head_sha }}*
