name: Release Post

# A published navidrome/navidrome release sends a repository_dispatch here
# (see release-post/navidrome-release-dispatch.yml). This workflow writes a blog post and its
# audio from the release notes, adds screenshots and videos from the linked PRs, and opens a PR
# for review. Nothing is published until the
# reviewer approves the PR (see release-post-review.yml).
on:
  repository_dispatch:
    types: [navidrome-release]
  workflow_dispatch:
    inputs:
      tag:
        description: "Navidrome release tag, for example v0.65.0"
        required: true
      regenerate:
        description: "Write a new post even if an earlier PR for this tag was closed without merging"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write # To create the release-post label.

concurrency:
  group: release-post-${{ github.event.client_payload.tag || inputs.tag }}
  cancel-in-progress: false

jobs:
  create:
    if: github.repository == 'navidrome/website' && vars.RELEASE_POST_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TAG: ${{ github.event.client_payload.tag || inputs.tag }}
      REVIEWER: ${{ vars.RELEASE_POST_REVIEWER || 'deluan' }}
      AUDIO: ${{ vars.RELEASE_POST_AUDIO || 'on' }}
      MEDIA: ${{ vars.RELEASE_POST_MEDIA || 'on' }}
      REGENERATE: ${{ inputs.regenerate == true }}
    steps:
      - name: Check tag
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a stable release tag. Prereleases are skipped."
            exit 1
          fi
          echo "BRANCH=release-post/$TAG" >> "$GITHUB_ENV"
          echo "BUNDLE=content/en/blog/releases/$TAG" >> "$GITHUB_ENV"
          echo "RELEASE_POST_USAGE_FILE=$RUNNER_TEMP/usage.jsonl" >> "$GITHUB_ENV"
          echo "RELEASE_POST_WARNINGS_FILE=$RUNNER_TEMP/warnings.md" >> "$GITHUB_ENV"

      # Optional GitHub App. A PR opened with GITHUB_TOKEN does not start the Preview Build,
      # and a personal token would make the reviewer the PR author, who cannot approve it.
      - name: Get app token
        id: app-token
        if: vars.RELEASE_POST_APP_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_POST_APP_ID }}
          private-key: ${{ secrets.RELEASE_POST_APP_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # A branch without a PR means an earlier run failed after the push. Then only the PR
      # is opened, and nothing is generated (or paid for) again.
      # With "regenerate", PRs closed without merging are ignored, and the branch is replaced.
      - name: Skip if the post already exists
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$REGENERATE" = "true" ]; then filter='map(select(.state != "CLOSED"))'; else filter='.'; fi
          pr=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$BRANCH" --state all --json number,state --jq "$filter | .[0].number // empty")
          if [ -e "$BUNDLE/index.md" ]; then
            echo "The post for $TAG is already published. Nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$pr" ]; then
            echo "PR #$pr already exists for $TAG. Nothing to do."
            if [ "$REGENERATE" != "true" ]; then echo "If it was closed, run again with \"regenerate\" to write a new post."; fi
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$REGENERATE" = "true" ]; then
            echo "Writing a new post for $TAG. The branch $BRANCH is replaced."
          elif git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "Branch $BRANCH exists without a PR. Opening the PR only."
            echo "resume=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Get release notes
        if: steps.exists.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R navidrome/navidrome \
            --json tagName,name,body,url,publishedAt,isDraft,isPrerelease > "$RUNNER_TEMP/release.json"
          if jq -e '.isDraft or .isPrerelease' "$RUNNER_TEMP/release.json" >/dev/null; then
            echo "::error::$TAG is a draft or a prerelease."
            exit 1
          fi

      - name: Setup Node.js
        if: steps.exists.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install ffmpeg
        if: steps.exists.outputs.skip != 'true' && steps.exists.outputs.resume != 'true' && (env.AUDIO != 'off' || env.MEDIA != 'off')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      # A post without media is still a post, so a failure here does not stop the run.
      - name: Collect media
        id: media
        if: steps.exists.outputs.skip != 'true' && steps.exists.outputs.resume != 'true' && env.MEDIA != 'off'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node release-post/media.mjs collect "$RUNNER_TEMP/release.json" "$BUNDLE"

      - name: Write post
        if: steps.exists.outputs.skip != 'true' && steps.exists.outputs.resume != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RELEASE_POST_MODEL: ${{ vars.RELEASE_POST_MODEL }}
          RELEASE_POST_REVIEWER: ${{ env.REVIEWER }}
          MEDIA_OUTCOME: ${{ steps.media.outcome }}
        run: |
          # Half-collected media is not offered to the model.
          if [ "$MEDIA_OUTCOME" = "failure" ]; then rm -rf "$BUNDLE/media" "$BUNDLE/media.json"; fi
          node release-post/generate-post.mjs "$RUNNER_TEMP/release.json"
          # Keeps only the media that the post shows.
          node release-post/media.mjs sync "$BUNDLE"

      - name: Record audio
        if: steps.exists.outputs.skip != 'true' && steps.exists.outputs.resume != 'true' && env.AUDIO != 'off'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RELEASE_POST_TTS_ENGINE: ${{ vars.RELEASE_POST_TTS_ENGINE }}
          RELEASE_POST_TTS_MODEL: ${{ vars.RELEASE_POST_TTS_MODEL }}
          RELEASE_POST_VOICE: ${{ vars.RELEASE_POST_VOICE }}
        run: node release-post/generate-audio.mjs "$BUNDLE"

      # The MP3 and the media go to the "blog-media-<tag>" release, not to git.
      - name: Upload audio and media
        if: steps.exists.outputs.skip != 'true' && steps.exists.outputs.resume != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: node release-post/assets.mjs publish "$BUNDLE"

      - name: Open PR
        if: steps.exists.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          PUSH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          RESUME: ${{ steps.exists.outputs.resume }}
        run: |
          if [ "$RESUME" != "true" ]; then
            node release-post/check-post.mjs "$BUNDLE/index.md" --published
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git switch -c "$BRANCH"
            git add "$BUNDLE"
            # The warnings go in the commit message too, so a resumed run can still show them.
            if [ -s "$RELEASE_POST_WARNINGS_FILE" ]; then
              git commit -m "blog: add Navidrome $TAG release post" -m "Warnings:" -m "$(cat "$RELEASE_POST_WARNINGS_FILE")"
            else
              git commit -m "blog: add Navidrome $TAG release post"
            fi
            auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
            echo "::add-mask::$auth"
            force=(); if [ "$REGENERATE" = "true" ]; then force=(--force); fi
            git -c http.extraheader="AUTHORIZATION: basic $auth" push "${force[@]}" origin "$BRANCH"
          else
            git fetch -q origin "$BRANCH"
            # Keeps the lines after "Warnings:". That line can be the first one of the body.
            git log -1 --format=%b FETCH_HEAD | awk 'found; /^Warnings:$/ { found = 1 }' > "$RELEASE_POST_WARNINGS_FILE"
          fi

          url=$(jq -r .url "$RUNNER_TEMP/release.json")
          node release-post/pr-body.mjs "$TAG" "$url" "$REVIEWER" "$RELEASE_POST_USAGE_FILE" "$RELEASE_POST_WARNINGS_FILE" > "$RUNNER_TEMP/body.md"
          gh label create release-post --color 5319e7 --description "Generated release blog post" 2>/dev/null || true
          # The URL, not the branch name: a closed PR can have the same branch name.
          pr_url=$(gh pr create --base master --head "$BRANCH" --label release-post \
            --title "blog: Navidrome $TAG release post" --body-file "$RUNNER_TEMP/body.md")
          echo "Opened $pr_url"
          gh pr edit "$pr_url" --add-reviewer "$REVIEWER" || echo "::warning::Could not request a review from $REVIEWER"

      - name: Usage summary
        if: always() && steps.exists.outputs.skip != 'true'
        run: |
          {
            echo "## API usage for $TAG (generation key)"
            node -e 'import("./release-post/lib.mjs").then(l => console.log(l.usageMarkdown(l.readUsage(process.argv[1]))))' "$RELEASE_POST_USAGE_FILE"
          } >> "$GITHUB_STEP_SUMMARY"
