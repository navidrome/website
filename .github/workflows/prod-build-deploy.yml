name: Build & Deploy

on:
    push:
        branches: [master]
    workflow_dispatch:
    schedule:
        - cron: "0 0 * * *" # Runs at 00:00 UTC every day

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        if: github.repository == 'navidrome/website'

        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup Hugo
              uses: peaceiris/actions-hugo@v3
              with:
                  hugo-version: "0.166.0"
                  extended: true

            - name: Install Dart Sass
              # Docsy 0.17+ compiles its SCSS with Dart Sass. Same version as the Docker image.
              env:
                DART_SASS_VERSION: "1.104.0"
              run: |
                curl -fsSL "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
                echo "$RUNNER_TEMP/dart-sass" >> "$GITHUB_PATH"
                "$RUNNER_TEMP/dart-sass/sass" --version

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  cache: "npm"

            - name: Install npm dependencies
              run: npm ci

            - name: Cache Hugo resources
              uses: actions/cache@v6
              with:
                  path: .hugo_cache/
                  key: hugo-resources-${{ runner.os }}-${{ hashFiles('assets/apps/*/index.yaml') }}
                  restore-keys: |
                      hugo-resources-${{ runner.os }}-

            - name: Fetch charts data
              env:
                  HUGO_ENV: production
                  CHARTS_URL: ${{ secrets.CHARTS_URL }}
                  CHARTS_API_KEY: ${{ secrets.CHARTS_API_KEY }}
              run: ./fetch-charts.sh

            - name: Build site
              env:
                  HUGO_ENV: production
                  HUGO_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: hugo --minify --cacheDir ${{ github.workspace }}/.hugo_cache

            - name: Deploy to Cloudflare Pages
              uses: cloudflare/wrangler-action@v4
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  command: pages deploy public/ --project-name=navidrome-website --branch=master
