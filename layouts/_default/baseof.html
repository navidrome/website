<!doctype html>
<html lang="{{ .Site.Language.Name }}" class="no-js {{ if .IsHome }}smooth-scroll{{ end }}"
  {{- $darkMode := partialCached "dark-mode-config.html" "dark-mode-global" -}}
  {{- if $darkMode.enable }} data-theme-init{{ end }}>
  <head>
    {{ partial "head.html" . }}
  </head>
  <body class="td-{{ .Kind }}">
    {{ partial "llms-directive.html" . -}}
    <header>
      {{ partial "navbar.html" . }}
    </header>
    <div class="container-fluid td-default td-outer">
      <main role="main" class="td-main">
        {{ block "main" . }}{{ end }}
      </main>
      {{ partial "footer.html" . }}
    </div>
    {{ partialCached "scripts.html" . }}
  </body>
</html>
